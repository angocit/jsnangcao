<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm mới sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Thêm mới sản phẩm</h1>
                    </div>
                    <div class="card-body">
                        <form id="productForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label">Tên sản phẩm</label>
                                <input type="text" class="form-control" id="name" name="name"
                                    placeholder="Nhập tên sản phẩm">                              
                            </div>

                            <div class="mb-3">
                                <label for="image" class="form-label">Hình ảnh (URL)</label>
                                <input type="url" class="form-control" id="image" name="image"
                                    placeholder="https://example.com/image.jpg">
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">Giá</label>
                                <div class="input-group">
                                    <input type="number" class="form-control" id="price" name="price"
                                        placeholder="Nhập giá sản phẩm" min="0" step="1000">
                                    <span class="input-group-text">VNĐ</span>
                                </div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">Thêm mới</button>
                           </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const productForm = document.getElementById("productForm")
        const name = document.getElementById("name")
        const image = document.getElementById("image")
        const price = document.getElementById("price")
        // Bắt sự kiện submit form
        productForm.addEventListener("submit",async(e)=>{
            e.preventDefault() // Ngăn trình duyệt chuyển hướng
            // Lấy thông tin từ input gom thành object
            const product = {
                name:name.value,
                image: image.value,
                price: price.value
            }
            // console.log(product);
            if (product.name.trim().length==0) {
                alert("Tên không để trống")
                name.focus() // Đưa con trỏ về ô input name
                return;
            }
            if (isNaN(product.price)||product.price<0||product.price.trim().length==0){
                alert("Giá phải là số và không âm")
                price.focus()
                return;
            }
            try {
                 // Call API để thêm
                const res = await fetch("http://localhost:3000/products",{
                    method:"POST",
                    headers: {"content-type":"application/json"},
                    body: JSON.stringify(product)
                })
                if (res.ok){
                    alert("Thêm mới thành công")
                }
            } catch (error) {
                alert("Thêm thất bại")
            }           
        })
    </script>
</body>
</html>
