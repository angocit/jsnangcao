<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Đăng nhập tài khoản</h1>
    <form id="userfrm">
        <input id="email" type="text" name="email" placeholder="Email"/>
        <input id="password" type="text" name="password" placeholder="Mật khẩu"/>
        <button>Đăng nhập</button>
    </form>
    <script>
        // Truy cập vào các ô input
        // const name = document.querySelector('[name=name]')
        const email = document.getElementById('email')
        const password = document.getElementById('password')
        // Truy cập form để bắt sự kiện submit
        const userfrm = document.getElementById('userfrm')
        // bắt sự kiện submit 
        userfrm.addEventListener('submit',async (e)=>{
            e.preventDefault() // Ngăn trình duyệt chuyển hướng
            const data = {
                email: email.value,
                password: password.value
            }
            if (validate(email.value,password.value)){
                try {
                    const response = await fetch(`http://localhost:3000/login`,{
                        method:'POST',
                        headers: {'Content-Type':'Application/json'},
                        body: JSON.stringify(data)
                    })
                    if (response.ok) {
                        // alert('Đăng nhập thành công')
                        const user = await response.json()
                        const token = user.accessToken
                        localStorage.setItem('userlogin',token)
                        alert('Đăng nhập thành công')                   
                    }
                    else alert('Sai tên đăng nhập hoặc mật khẩu')
                } catch (error) {
                    alert('Sai tên đăng nhập hoặc mật khẩu')
                }
            }
            else {
                alert('Email phải đúng định dạng và mật khẩu > 5 kí tự')
            }
        })
        const validate = (email,password)=>{
            // Biểu thức AND của short-circuiting
            return email.indexOf('@')>0&&email.indexOf('.')>-1&&password.length>5
        }
    </script>
</body>
</html>
