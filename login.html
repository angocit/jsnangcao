<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Đăng nhập</h1>
    <form id="productfrm">
      <input type="text" name="email" placeholder="Email" />
      <input type="text" name="password" placeholder="Mật khẩu" />
      <button>Đăng nhập</button>
    </form>
    <script>
      const email = document.querySelector("input[name=email]");
      const password = document.querySelector("input[name=password]");
      const productfrm = document.getElementById("productfrm");
      // bắt sự kiện submit
      productfrm.addEventListener('submit',async (e)=>{
        e.preventDefault() // Ngăn trình duyệt chuyển hướng
        const data = {
            email: email.value,
            password: password.value,
        }
        if (validate(email.value,password.value)) {
            try {
                const response = await fetch(`http://localhost:3000/login`,{
                    method:'POST',
                    headers:{'Content-type':'Application/json'},
                    body: JSON.stringify(data)
                })
                if (!response.ok) throw await response.json()
                const user = await response.json()
                console.log(user);
                localStorage.setItem('token',user.accessToken)                
                alert('Đăng nhập thành công')
            } catch (error) {
               alert(error)            
            }
        }
        else alert('Email đúng định dang, mật khẩu > 5 kí tự')
      })
      const validate = (email,password)=>{
        //Biểu thức AND
        return email.includes('@')&&email.includes('.')&password.length>5
      }
    </script>
  </body>
</html>
