<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Đăng nhập</h1>
    <form id="form">
        <input id="email" name="email" placeholder="Email"/>
        <input id="password" name="password" placeholder="Password"/>
        <button>Đăng nhập</button>
    </form>
    <script>
        // Truy cập form
        const form = document.getElementById("form")
        // Lắng nghe sự kiện submit
        form.addEventListener("submit",async (e)=>{
            e.preventDefault() // Ngăn trình duyệt chuyển hướng
            // Lấy dữ liệu từ input
            const email = document.getElementById("email").value
            const password = document.getElementById("password").value
            // Validate Email 
            if (email.trim().length==0||email.indexOf('@')==-1||email.indexOf('.')==-1){
                alert("Email đúng định dạng")
                return;
            }
            //Validate mật khẩu
            if (password.trim().length<7){
                alert("Mật khẩu >6 ký tự")
                return
            }
            // GỬi dữ liệu để lưu db
            try {
                const response = await fetch(`http://localhost:3000/login`,
                    {
                        method:"POST",
                        headers: {"content-type":"application/json"},
                        body:JSON.stringify({email,password})
                    }
                )
                if (!response.ok) throw "Sai tên đăng nhập hoặc mật khẩu"
                const user = await response.json()
                console.log(user);
                localStorage.setItem("token",user.accessToken)                
                alert("Đăng nhập thành công")
            } catch (error) {
                alert(error)
            }
        })
    </script>
</body>
</html>
