<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="content">
        <span class="item">1</span>
        <span class="item">2</span>
        <span class="item">3</span>
        <h1 id="title">Xin chào WD21202</h1>
        <span class="item">4</span>
        <span class="item">5</span>
        <span class="item">6</span>
        <input type="text" placeholder="Nhập địa chỉ" name="address"/>
    </div>
    <script>
// Truy cập phần tử DOM
        // - truy cập theo id 
        const content = document.getElementById("content")
        console.log(content);        // Trả về phần tử duy nhất
        // - Truy cập theo class
        const item = document.getElementsByClassName("item")
        console.log(item); // Trả về danh sách    
        // Truy cập theo tên thẻ tagname
        const span = document.getElementsByTagName("span")
        console.log(span); // Trả về danh sách    
        // Truy cập theo attribute name 
        const address = document.getElementsByName("address")
        console.log(address); // Trả về danh sách        
        // Sử querySelector và querySelectorAll có thể thay thế tất cả các phương thức
        // bên trên 
        // -- Các thức hoạt động: Cả 2 có cú pháp giống nhau
        // - querySelector: Trả về phần tử duy nhất 
        // (phần tử đầu tiên nó gặp thỏa mãn điều kiện)
        //  - querySelectorAll: trả về danh sách phần tử thỏa mãn điều kiện
        // VD: Truy cập phần tử theo id : 
        const content2 = document.querySelector("#content") // tương đương getElementById
        console.log(content2); 
        // -Truy cập theo class
        const item1 = document.querySelector(".item") 
        // Trả về phần tử đầu tiên có class là item
        const item2 = document.querySelectorAll(".item") 
        // Trả về danh sách các phần tử có class là item
        console.log(item2);
        // - Truy cập theo tên thẻ tagname
        const span1 = document.querySelector("span") 
        console.log(span1);     // Trả về phần tử span đầu tiên
        const span2 = document.querySelectorAll("span")         
        console.log(span2);   // Trả về sanh sách các phần tử span
        // Truy cập theo attribute
        const address2 = document.querySelector("[name=address]")
        console.log(address2);
        // hoặc 
        const address3 = document.querySelector("input[name=address]")
        console.log(address3);        
        // Truy cập qua phương thức, thuộc tính của phần tử khác
        const h1 = document.getElementById("title")
        //  Lấy phần tử cha
        const content3 = h1.parentNode
        console.log(content3);  
        // lấy các phần tử con
        const listitem = content.children
        console.log(listitem);
        // Lấy phần tử phía trước h1
        const prev = h1.previousElementSibling
        console.log(prev);
        // Lấy phần tử phía sau h1
        const next = h1.nextElementSibling
        console.log(next);
        // Tip: có thể sử dụng cú pháp console.dir để xem các phương thức và thuộc
        // tính của phần tử 
        console.dir(content)
    </script>
</body>
</html>
