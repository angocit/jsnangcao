<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #sidebar{
            position: fixed;
            top: 0;
            right: 0;
            width: 350px;
            height: 100vh;
            border-left: 1px solid #ccc;
            padding: 10px;
            /* overflow-y: auto; */
            background-color: #f1f1f1;
            transform: translateX(100%);
            transition: all 0.3s linear;
        }
        #sidebar button{
            transform: translateX(-100%);
        }
        #sidebar.active{
            transform: translateX(0);
        }
        #sidebar.active button{transform: translateX(0);}

    </style>
</head>
<body>
    <input placeholder="Địa chỉ" id="address" name="address"/>
    <input placeholder="Họ tên" id="name"/>
    <div class="item" datavalue = 1>Div item</div>
    <div id="datademo" data = "MD20301">Ahihih</div>
    <div class="content">
        <span class="item">1</span>
        <span class="item">2</span>
        <span class="item">3</span>
        <span class="item">4</span>
        <span class="item">5</span>
    </div>
    <button id="submit">Submit</button>
    <h1>Danh sách sinh viên</h1>
    <form id="infofrm">
        <input type="text" placeholder="Họ tên SV" name="name"/>
        <input type="text" placeholder="Địa chỉ" name="address"/>
        <input type="text" placeholder="Số điện thoại" name="phone"/>        
        <button type="submit">Thêm mới</button>
    </form>
    <div id="sidebar">
        <div class="header"><button onclick="CloseSidebar()">Close</button></div>
        <h3>Danh sách sinh viên</h3>    
        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Họ tên</th>
                    <th>Địa chỉ</th>
                    <th>SĐT</th>
                </tr>
            </thead>
            <tbody>

            </tbody>
        </table>
    </div>
    <script src="lession7.js"></script>
</body>
</html>
