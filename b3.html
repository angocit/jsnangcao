<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Danh sách hình ảnh</h2>
    <div id="content" class="list-picture"></div>
    <script>
        // Xử lý bất đồng bộ 
        // Nhận biết tác vụ bất đồng bộ
        // 1. Call API (fetch API, axios), gọi api để lấy dữ liệu
        // 2. Lưu file
        // 3. Timeout, Interval
        // Tip nhận biết: nó cần thời gian để xử lý, kết quả không biết trước (thành công hoặc thất bại)
// Xử lý như nào?
// 3 cách: Callback, promise (then,catch), hàm async/await
// Xử lý bất đồng bộ bằng hàm async/await
// Cấu trúc của 1 hàm async await :
// Hàm thông thường
// async function tenham(){
//     await ở trước tác vụ bất đồng bộ 
// }
// Hàm arrow function (hàm mũi tên)
// const tenham = async()=>{
//  await ở trước tác vụ bất đồng bộ 
// }
// Ví dụ: call api lấy dữ liệu bằng hàm bất đồng bộ 
     const getAllPicture = async ()=>{
        // Call API
        const response = await fetch(`https://picsum.photos/v2/list`)
        console.log(response);
        // Chuyển response sang json
        const data = await response.json()
        console.log(data);        
     }
     //Gọi hàm
     getAllPicture()

     // Truy cập vào phần tử trên DOM
// Các cách truy cập vào phần tử trên DOM
// 1. Truy cập qua ID
const content = document.getElementById("content")
console.log(content);
//2. Truy cập qua class
const contentclass = document.getElementsByClassName("list-picture")
console.log(contentclass[0]);
const contentfirst = document.querySelector(".list-picture")
console.log(contentfirst);
    </script>
</body>
