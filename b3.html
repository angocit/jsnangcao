<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Danh sách hình ảnh</h2>
    <div id="content" class="list-picture"></div>
    <button id="btnclick">Click here</button>
    <script>
        // Xử lý bất đồng bộ 
        // Nhận biết tác vụ bất đồng bộ
        // 1. Call API (fetch API, axios), gọi api để lấy dữ liệu
        // 2. Lưu file
        // 3. Timeout, Interval
        // Tip nhận biết: nó cần thời gian để xử lý, kết quả không biết trước (thành công hoặc thất bại)
// Xử lý như nào?
// 3 cách: Callback, promise (then,catch), hàm async/await
// Xử lý bất đồng bộ bằng hàm async/await
// Cấu trúc của 1 hàm async await :
// Hàm thông thường
// async function tenham(){
//     await ở trước tác vụ bất đồng bộ 
// }
// Hàm arrow function (hàm mũi tên)
// const tenham = async()=>{
//  await ở trước tác vụ bất đồng bộ 
// }
// Ví dụ: call api lấy dữ liệu bằng hàm bất đồng bộ 
     const getAllPicture = async ()=>{
        // Call API
        const response = await fetch(`https://picsum.photos/v2/list`)
        console.log(response);
        // Chuyển response sang json
        const data = await response.json()
        console.log(data);        
     }
     //Gọi hàm
     getAllPicture()

     // Truy cập vào phần tử trên DOM
// Các cách truy cập vào phần tử trên DOM
// 1. Truy cập qua ID
const content = document.getElementById("content")
console.log(content);
//2. Truy cập qua class
// const contentclass = document.getElementsByClassName("list-picture")
// console.log(contentclass);
// const contentfirst = document.querySelector(".list-picture")
// console.log(contentfirst);
// Thao tác.
// 1. Đặt nội dung html trong phần tử truy cập được 
content.innerHTML = `
<img width="200" src="https://bizweb.dktcdn.net/thumb/1024x1024/100/307/505/products/hm-960.jpg?v=1540181546593"/>
<h3>Ngocnv34</h3>
`
// Tạo ra 1 phần tử dom mới
const item = document.createElement("div")
// Set nội dung cho phần tử mới
item.innerHTML = `
<img width="200" src="https://product.hstatic.net/1000309554/product/05.03.22-dong-ho-walnut-la-ma-khong-vien-size-lon-4_ea6889d96bf74c4389d445985f703928_1024x1024.jpg"/>
<h3>Ngocnv34 2</h3>
`
// Đưa vào cuối của phần tử content
// content.append(item)
// Đưa vào làm phần tử đầu tiên của content
content.prepend(item)

// Bắt sự kiện
//  2 Bước.
// B1: truy cập vào phần tử muốn bắt sự kiện 
const bt = document.getElementById("btnclick")
// Bắt sự kiện click
bt.addEventListener('click',()=>{
    // Viết câu lệnh sau khi click
    alert("Bạn vừa click")
})
    </script>
</body>
</html>
