<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="frmuser">
        <input type="text" placeholder="Email" name="email"/>
        <input type="text" placeholder="Password" name="password"/>
        <button type="submit">Đăng ký</button>
    </form>
    <script>
        const frmuser = document.getElementById("frmuser")
frmuser.addEventListener('submit',async (e)=>{
    e.preventDefault() // Ngăn trình duyệt chuyển hướng
    // Đọc dữ liệu từ input
    const email = document.querySelector("#frmuser input[name=email]")
    const password = document.querySelector("#frmuser input[name=password]")
    const data = {email:email.value,password:password.value}
    // Thực hiện call API
    if (email.value.trim()==''||email.value.indexOf('@')==-1||email.value.indexOf('.')==-1) {
        alert("Email không đúng định dạng")
        email.focus()
        return;
    }
    if (password.value.trim()==''||password.value.trim().length<5) {
        alert("Mật khẩu phải >4 kí tự")
         password.focus()
        return;
    }   
    try {
         const response = await fetch("http://localhost:3000/register",{
        method:'POST',
        headers: {'Content-type':'Application/json'},
        body: JSON.stringify(data)
        })
        if (!response.ok) throw await response.json()
        alert("Đăng ký thành công")
    } catch (error) {
        alert(error)
    }
    // console.log(product);    
})

    </script>
</body>
</html>
