<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
    <h1>Đăng ký tài khoản</h1>
    <form id="userfrm">
        <input id="name" type="text" name="name" placeholder="Họ tên"/>
        <input id="email" type="text" name="email" placeholder="Email"/>
        <input id="password" type="text" name="password" placeholder="Mật khẩu"/>
        <button>Đăng ký</button>
    </form>
    <script>
        // Truy cập vào các ô input
        // const name = document.querySelector('[name=name]')
        const name = document.getElementById('name')
        const email = document.getElementById('email')
        const password = document.getElementById('password')
        // Truy cập form để bắt sự kiện submit
        const userfrm = document.getElementById('userfrm')
        // bắt sự kiện submit 
        userfrm.addEventListener('submit',async (e)=>{
            e.preventDefault() // Ngăn trình duyệt chuyển hướng
            const data = {
                name: name.value,
                email: email.value,
                password: password.value
            }
            if (validate(email.value,password.value)){
                try {
                    const response = await fetch(`http://localhost:3000/register`,{
                        method:'POST',
                        headers: {'Content-Type':'Application/json'},
                        body: JSON.stringify(data)
                    })
                    if (response.ok) {
                        window.location='login.html'
                        alert('Đăng ký thành công')
                    }
                    else alert('Đăng ký thất bại')
                } catch (error) {
                    alert('Đăng ký thất bại')
                }
            }
            else {
                alert('Email phải đúng định dạng và mật khẩu > 5 kí tự')
            }
        })
        const validate = (email,password)=>{
            // Biểu thức AND của short-circuiting
            return email.indexOf('@')>0&&email.indexOf('.')>-1&&password.length>5
        }
    </script>
</body>
</html>
