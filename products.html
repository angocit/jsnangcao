<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">Danh sách sản phẩm</h1>
        <a href="product-add.html" class="bg-blue-800 text-white px-3 py-2 rounded mb-5 block max-w-[200px] text-center">Thêm mới sản phẩm</a>
        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <h1>Bảng 1</h1>
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-gray-800 text-white">
                        <th class="px-4 py-3 text-sm font-semibold uppercase">STT</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase">Tên sản phẩm</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase">Ảnh sản phẩm</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase">Giá tiền</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="table1"></tbody>
            </table>
            <h1>Bảng 2</h1>
            <table class="w-full text-left">
                <thead>
                    <tr class="bg-gray-800 text-white">
                        <th class="px-4 py-3 text-sm font-semibold uppercase">STT</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase">Tên sản phẩm</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase">Ảnh sản phẩm</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase">Giá tiền</th>
                        <th class="px-4 py-3 text-sm font-semibold uppercase text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="table2"></tbody>
            </table>
        </div>
    </div>
    <script type="module" src="product.js"></script>
</body>
</html>
