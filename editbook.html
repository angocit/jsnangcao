<body>
    <h1>Cập nhật sách</h1>
    <form id="bookfrm">
        <input id="name" type="text" name="name" placeholder="Tên sách"/>
        <input id="publish" type="text" name="publish" placeholder="Nhà xuất bản"/>
        <input id="year" type="text" name="year" placeholder="Năm xuất bản"/>
        <input id="price" type="text" name="price" placeholder="Giá tiền"/>
        <button>Cập nhật</button>
    </form>
    <script>
        // Lấy id sản phẩm từ url
        const params = new URLSearchParams(location.search)
        const bookid = params.get('id')
        // console.log(bookid);

        // const name = document.querySelector('[name=name]')
        const name = document.getElementById('name')
        const publish = document.getElementById('publish')
        const year = document.getElementById('year')
        const price = document.getElementById('price')
        // Viết hàm call API lấy chi tiết sách theo id
        const GetBookById=async (id)=>{
            try {
                const response = await fetch(`http://localhost:3000/books/${id}`)
                const book = await response.json()
                name.value = book.name
                publish.value = book.publish
                year.value = book.year
                price.value = book.price
            } catch (error) {

        }
