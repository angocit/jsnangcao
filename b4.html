        // Map: Lưu trữ giá trị theo cặp key-value
        // Cú pháp 
        const map = new Map()
        // Các phương thức và thuộc tính của Map

        map.set("name","Ngọc")

        // - Truy cập giá trị trong map: map.get(key) 
        // => trả về undefined nếu không tồn tại key

        // ứng dụng: 1. Truy cập nhanh với độ phức tạp là O(1)
        // - Đếm số lượng từ xuất hiện trong câu
        const str = "hôm nay là thứ 2, trời hôm nay rất đẹp, hôm"
        const strmap = new Map()
        for (item of str.split(" ")){
            if (strmap.has(item)){
                strmap.set(item,strmap.get(item)+1)
            }
            else {
                strmap.set(item,1)
            }
        }

        console.log(`Số lượng xuất hiện từ ${kw}: ${strmap.get(kw)}`);
