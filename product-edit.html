<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md mx-4">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Thêm mới sản phẩm</h1>
        <form id="productform" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên sản phẩm</label>
                <input type="text" id="name" placeholder="Tên sản phẩm" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ảnh sản phẩm</label>
                <input type="text" id="image" placeholder="Ảnh sản phẩm" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Giá tiền</label>
                <input type="number" id="price" placeholder="Giá tiền" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition">Cập nhật</button>
        </form>
    </div>
    <script>
        // Truy cập form
        const productform = document.getElementById("productform")
        // Truy cập các ô input
        const name = document.getElementById("name")
        const image = document.getElementById("image")
        const price = document.getElementById("price")

        // Lấy id từ URL
        const param = new URLSearchParams(location.search)
        const id = param.get("id")
        console.log(id);  
        // Call API lấy chi tiết sản  phẩm theo id sau đó fill vào ô input
        const getProductByid = async ()=>{
            try {
                const res=await fetch(`http://localhost:3000/products/${id}`)
                if (!res.ok) throw await res.json()
                const product = await res.json()
                // Fill data vào ô input
                name.value = product.name
                image.value = product.image 
                price.value = product.price
            } catch (error) {
                alert("Lỗi. Không có thông tin sản phẩm")
            }
        }
        // Gọi hàm
        getProductByid()
        // Bắt sự kiện submit
        productform.addEventListener("submit",async (e)=>{
            e.preventDefault() // Ngăn trình duyệt chuyển hướng
            // Tạo đối tượng sản phẩm
            const product = {
                name: name.value,
                image: image.value,
                price: price.value
            }
            try {
                // Call API 
                const res = await fetch(`http://localhost:3000/products/${id}`,{
                    method:'PUT',
                    headers: {'Content-type':'application/json'},
                    body: JSON.stringify(product)
                })
                if (!res.ok) throw await res.json()
                window.location = "products.html"
                alert("Cập nhật thành công")            
            } catch (error) {
                console.log(error);
                alert("Cập nhật thất bại")
            }
        })
    </script>
</body>
</html>
