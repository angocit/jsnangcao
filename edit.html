<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Sửa sản phẩm</h1>
    <form id="productfrm">
      <input type="text" name="name" placeholder="Tên sản phẩm" />
      <input type="text" name="image" placeholder="Ảnh sản phẩm" />
      <input type="text" name="price" placeholder="Giá sản phẩm" />
      <button>Update</button>
    </form>
    <script>
        const params = new URLSearchParams(location.search)
        const productid = params.get('id')
      const name = document.querySelector("input[name=name]");
      const image = document.querySelector("input[name=image]");
      const price = document.querySelector("input[name=price]");
      (async()=>{
            try {
                const response = await fetch(`http://localhost:3000/products/${productid}`)
                if (!response.ok) throw new Error('Lỗi')
                // Chuyển response sang json
                const product = await response.json()
                // console.log(product);
                // Gán thông tin sản phẩm vào input
                name.value = product.name
                image.value = product.image
                price.value = product.price
            } catch (error) {
                console.log(error);                
            }
        })()

      const productfrm = document.getElementById("productfrm");
      // bắt sự kiện submit
      productfrm.addEventListener('submit',async (e)=>{
        e.preventDefault() // Ngăn trình duyệt chuyển hướng
        const data = {
            name: name.value,
            image: image.value,
            price: price.value,
        }
        if (validate(name.value,image.value,price.value)) {
            try {
                const response = await fetch(`http://localhost:3000/products/${productid}`,{
                    method:'PUT',
                    headers:{'Content-type':'Application/json'},
                    body: JSON.stringify(data)
                })
                if (!response.ok) throw new Error('Lỗi')
                window.location = "productlist.html"
                alert('Cập nhật thành công')
            } catch (error) {
                console.log(error);            
            }
        }
        else alert('Tên, ảnh không để trống. Giá >1000')
      })
      const validate = (name,image,price)=>{
        //Biểu thức AND
        return name.trim().length>0&&image.trim().length>0&&!isNaN(price)&&price>1000
      }
    </script>
  </body>
</html>
