        const a = [7,8,1,20]

        // Lưu ý: forEach sẽ không sử dụng được cú pháp break, continue
        // map => tạo ra mảng mới (theo logic riêng), không làm thay đổi mảng gốc
        const b = a.map((item,index)=>{
            // return item*2  // Các phần tử được x2


            // Ở vị trí lẻ thì x2, vị trí chẵn thì giữ nguyên
            if (index%2==0) return item*2
            return item
        })
        console.log(a);
        console.log('----------------------');

        // VD tính tổng các phần tử mảng a
        const tong = a.reduce((value,item,index)=>{

        },0)
        console.log('Tổng mảng a là: '+tong);

        a.push(100)

        console.log(c);
