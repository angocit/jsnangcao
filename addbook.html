<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
    <style>
        .gap-3{gap: 10px;}
    </style>
    <div class="container">
        <h1>Thêm mới sách</h1>
        <form id="bookfrm" class="d-flex gap-3 flex-column">
            <input class="form-control" id="name" type="text" name="name" placeholder="Tên sách"/>
            <input class="form-control" id="publish" type="text" name="publish" placeholder="Nhà xuất bản"/>
            <input class="form-control" id="year" type="text" name="year" placeholder="Năm xuất bản"/>
            <input class="form-control" id="price" type="text" name="price" placeholder="Giá tiền"/>
            <button class="btn btn-primary">Thêm mới</button>
        </form>
    </div>
    <script>
        // Truy cập vào các ô input
        // const name = document.querySelector('[name=name]')
        const name = document.getElementById('name')
        const publish = document.getElementById('publish')
        const year = document.getElementById('year')
        const price = document.getElementById('price')
        // Truy cập form để bắt sự kiện submit
        const bookfrm = document.getElementById('bookfrm')
        // bắt sự kiện submit 
        bookfrm.addEventListener('submit',async (e)=>{
            e.preventDefault() // Ngăn trình duyệt chuyển hướng
            const data = {
                name: name.value,
                publish: publish.value,
                year: year.value,
                price:price.value
            }
            
            if (validate(name.value,year.value,price.value)){
                try {
                    const response = await fetch(`http://localhost:3000/books`,{
                        method:'POST',
                        headers: {'Content-Type':'Application/json'},
                        body: JSON.stringify(data)
                    })
                    if (response.ok) alert('Thêm mới thành công')
                    else alert('Thêm thất bại')
                } catch (error) {
                    alert('Thêm thất bại')
                }
            }
            else {
                alert(`
                    Tên không để trống.
                    Năm xuất bản < 2025
                    Giá phải là số không âm
                `)
            }
        })
        const validate = (name,year,price)=>{
            // Biểu thức AND của short-circuiting
            return name.trim().length>0&&!isNaN(year)&&year.length>0&&year<2025&&!isNaN(price)&&price.length>0&&price>-1
        }
    </script>
</body>
</html>
